[project]
name = "temper"
version = "0.1.0"
description = "Research infrastructure for calibrated, verifiable decision primitives and selective model escalation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
security = [
    "bandit>=1.7",
    "detect-secrets>=1.5",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "experiments"]
